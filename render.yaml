services:
  - type: web
    name: aeemci-universitaire
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_PATH
        value: /var/data/aeemci.sqlite
      - key: ADMIN_SETUP_KEY
        sync: false
    disk:
      name: aeemci-data
      mountPath: /var/data
      sizeGB: 1
